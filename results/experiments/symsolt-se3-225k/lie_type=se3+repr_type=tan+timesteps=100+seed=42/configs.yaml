shape_names:
- tet
- cube
- icosa
- cone
- cyl
color_mode: none
train_dataset: train-45k
test_dataset: test-5k
lie_type: se3
image_res: 224
repr_type: tan
resnet_depth: 34
mlp_layers: 1
fourier_block: true
activ_fn: leaky_relu
learn_noise: true
loss_name: chordal
train_steps: 800000
batch_size: 16
n_slices: 256
ckpt_steps: 100000
init_lr: 0.0001
lr_decay_start: 0.5
lr_decay_steps: 0.5
lr_decay_rate: 0.1
end_lr: 1.0e-05
ema_enabled: true
ema_steps: 5
ema_tau: 0.999
noise_type: power
noise_start: 1.0e-08
noise_end: 1.0
power: 3
timesteps: 100
restore_step: null
restore_path: null
skip_train: false
skip_test: false
seed: 42
